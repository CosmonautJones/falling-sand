<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Falling Sand</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0b10;
        color: #d8d8e0;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #2a2a36;
        width: min(90vw, 720px);
        height: auto;
        touch-action: none;
      }
      #toolbar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      button {
        background: #1a1a24;
        color: #d8d8e0;
        border: 1px solid #2a2a36;
        padding: 6px 12px;
        cursor: pointer;
        font: inherit;
      }
      button[aria-pressed="true"] { background: #2f2f42; border-color: #4a4a60; }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <canvas id="stage"></canvas>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
